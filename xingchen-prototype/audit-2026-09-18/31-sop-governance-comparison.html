<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOP 治理改造设计 QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0f172a; color: #e2e8f0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      header { padding: 16px 20px; border-bottom: 1px solid #334155; }
      h1 { margin: 0; font-size: 19px; }
      p { margin: 4px 0 0; color: #94a3b8; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px; align-items: start; }
      figure { margin: 0; padding: 10px; border: 1px solid #334155; border-radius: 9px; background: #111827; }
      figcaption { margin-bottom: 8px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; border-radius: 5px; background: #fff; }
    </style>
  </head>
  <body>
    <header>
      <h1>SOP 治理改造：既有视觉真源 / 新增页面状态</h1>
      <p>验证新增治理信息、定义流程与模型映射保持原型的导航、排版、密度、颜色和组件语言。</p>
    </header>
    <main>
      <figure>
        <figcaption>既有视觉真源</figcaption>
        <img src="/assets/reference-monitor.png" alt="既有监控大屏视觉真源" />
      </figure>
      <figure>
        <figcaption>SOP 标准库 · 治理原则</figcaption>
        <img src="./28-sop-governance-list.png" alt="新版 SOP 标准库" />
      </figure>
      <figure>
        <figcaption>教师定义步骤</figcaption>
        <img src="./25-sop-ground-truth-editor.png" alt="教师定义 SOP 步骤" />
      </figure>
      <figure>
        <figcaption>数据与模型映射</figcaption>
        <img src="./26-sop-model-mapping.png" alt="动作数据与模型映射" />
      </figure>
    </main>
  </body>
</html>
